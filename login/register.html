<!DOCTYPE html>
<!-- Coding By CodingNepal - youtube.com/codingnepal -->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
</head>
<body>
  <div class="wrapper">
    <header>Silahkan Login</header>
    <form id="loginForm">
      <div class="field username">
        <div class="input-area">
           <input type="text" id="username" placeholder="Nama Pengguna" required>
          <i class="icon fas fa-user"></i>
          <i class="error error-icon fas fa-exclamation-circle"></i>
        </div>
        <div class="error error-txt">Nama pengguna tidak boleh kosong</div>
      </div>
      <div class="field password">
        <div class="input-area">
         <input type="password" id="password" placeholder="Password" required>
          <i class="icon fas fa-lock"></i>
          <i class="error error-icon fas fa-exclamation-circle"></i>
        </div>
        <div class="error error-txt">Password tidak boleh kosong</div>
      </div>
      <div class="pass-txt"><a href="#">Lupa password?</a></div>
      <input type="submit" value="Login">
    </form>
    <div class="sign-txt">Not yet member? <a href="register.html">Signup now</a></div>
  </div>

  <script src="script.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
