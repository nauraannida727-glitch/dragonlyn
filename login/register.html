<!DOCTYPE html>
<!-- Coding By CodingNepal - youtube.com/codingnepal -->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Register</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
</head>
<body>
  <div class="wrapper">
    <header>Silahkan Register</header>
    <form id="registerForm">
      <div class="field username">
        <div class="input-area">
           <input type="text" id="username" placeholder="Nama Pengguna" required>
          <i class="icon fas fa-user"></i>
          <i class="error error-icon fas fa-exclamation-circle"></i>
        </div>
        <div class="error error-txt">Nama pengguna tidak boleh kosong</div>
      </div>

       <div class="field email">
        <div class="input-area">
          <input type="email" id="email" placeholder="Email" required>
          <i class="icon fas fa-envelope"></i>
          <i class="error error-icon fas fa-exclamation-circle"></i>
        </div>
        <div class="error error-txt">Email tidak boleh kosong</div>
      </div>

      <div class="field password">
        <div class="input-area">
          <input type="password" id="password" placeholder="Password" required>
          <i class="icon fas fa-lock"></i>
          <i class="error error-icon fas fa-exclamation-circle"></i>
        </div>
        <div class="error error-txt">Password tidak boleh kosong</div>
      </div>
       <p id="message"></p>
      <input type="submit" value="Masuk">
    </form>
    <div class="sign-txt">Sudah punya akun? <a href="index.html">Login</a></div>
  </div>

  <script src="script.js"></script>
  <script src="js/register.js" defer></script>

</body>
</html>
